# HWT9053 CAN 驱动配置文件
/**:
  ros__parameters:
    # CAN 接口配置
    can_interface: "can0"

    # IMU 话题配置
    imu_topic_name: "imu/data"
    imu_frame_id: "imu_link"

    # CAN 总线话题
    can_bus_topic: "from_can_bus"

    # 日志配置
    log_debug: false

    # 传感器协方差（可根据实际标定调整）
    # 线性加速度协方差 (m/s^2)^2
    accel_covariance: 3.4e-5

    # 角速度协方差 (rad/s)^2
    gyro_covariance: 5.8e-8

    # 机器人名称和是否使用仿真（需要上层launch文件或CLI指定）
    # robot_name: "robot"
    # use_sim_time: false
